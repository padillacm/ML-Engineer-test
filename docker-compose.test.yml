# Test environment: the full pytest suite in the test image against a real Qdrant server.
#
#   docker compose -f docker-compose.test.yml run --rm tests     # build if needed, run the suite
#   docker compose -f docker-compose.test.yml down -v            # remove the Qdrant container
#
# Tests marked `qdrant_server` run only when QDRANT_URL is set, which this file does for `tests`.
# Nothing is published to the host: the two services talk on an internal network only, which has
# no route out, so the tests cannot reach the internet either.
# TEST_IMAGE names the built image (default docintel-test); give each parallel compose project
# its own, e.g. TEST_IMAGE=docintel-test-ci docker compose -p ci -f docker-compose.test.yml ...
# TORCH_VARIANT=cuda builds the test image with the CUDA build of torch and reserves the GPU
# for the run (docker-compose.torch.yml), for the `cuda`-marked tests; give it its own image:
#   TORCH_VARIANT=cuda TEST_IMAGE=docintel-test-cuda docker compose -f docker-compose.test.yml #     run --rm tests pytest -q -m cuda

services:
  qdrant:
    # qdrant/qdrant v1.20.0 (multi-arch index digest, resolved 2026-10-27). Matches
    # qdrant-client 1.20 (the client accepts servers within one minor version); collection
    # metadata, which the adapter uses to record the embedding identity, needs Qdrant >= 1.16.
    # Bump tag and digest together, then rerun this suite.
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    networks:
      - internal
    # Throwaway storage: every run starts from an empty database.
    tmpfs:
      - /qdrant/storage
      - /qdrant/snapshots
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp sends a plain HTTP request to /readyz.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333
          && printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  tests:
    # The torch variant (default cpu): build argument and, for cuda, the GPU reservation.
    extends:
      file: docker-compose.torch.yml
      service: torch-${TORCH_VARIANT:-cpu}
    build:
      context: .
      target: test
      # The detector model, as for the app's build in docker-compose.yml (the test image carries
      # it too; the `injection_model` tests need it). INJECTION_MODEL=0 builds without it.
      args:
        INJECTION_MODEL: ${INJECTION_MODEL:-1}
      secrets:
        - source: hf_token${HF_TOKEN:+_from_env}
          target: hf_token
    image: ${TEST_IMAGE:-docintel-test}
    environment:
      QDRANT_URL: http://qdrant:6333
    networks:
      - internal
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["pytest", "-q"]

networks:
  internal:
    internal: true

secrets:
  # The Hugging Face token of the test image's build, HF_TOKEN from .env or the shell, or the
  # empty placeholder without one (docker-compose.yml explains the scheme).
  hf_token_from_env:
    environment: HF_TOKEN
  hf_token:
    file: ./deploy/empty-secret
