# Smoke tests of the running stack, and hygiene checks of the runtime image. Use together with
# docker-compose.yml (with COMPOSE_PROFILES=gpu to test the stack with the local model):
#
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml run --rm smoke
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml run --rm hardening
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml run --rm hygiene
#
# `smoke` builds the test image (docintel-test), starts the stack if it is not running, waits
# until the app is healthy and runs tests/deploy (marker deployed_service) against
# http://app:8000 over the internal network. The tests ingest the sample PDFs into the stack's
# store. `hardening` runs the same image with the Docker socket mounted read-only and checks
# the running app and Qdrant containers through the Engine API (tests/deploy/
# test_hardening_smoke.py): read-only root, every capability dropped, no-new-privileges, the
# process and memory limits, tmpfs scratch, no token in the environment, and a write outside
# tmpfs refused inside the app container. (From the host, with the docker command on PATH, the
# same tests run with SERVICE_URL set.) `hygiene` runs the runtime image without a network and
# fails if it contains test or development code, uv, a .env file, Playwright or a browser, runs
# as root, can download models, lets the service change its own code, its pdf.js files or the
# detector model, carries pdf.js files other than those pinned in deploy/pdfjs.lock, or holds a
# Hugging Face token, or a torch other than its TORCH_VARIANT (the CPU image with an NVIDIA
# library or CUDA support).

services:
  smoke:
    profiles: [smoke]
    build:
      context: .
      target: test
      # The detector model, as for the app's build in docker-compose.yml (the test image carries
      # it too; the `injection_model` tests need it). INJECTION_MODEL=0 builds without it.
      args:
        INJECTION_MODEL: ${INJECTION_MODEL:-1}
      secrets:
        - source: hf_token${HF_TOKEN:+_from_env}
          target: hf_token
    image: ${TEST_IMAGE:-docintel-test}
    environment:
      SERVICE_URL: http://app:8000
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    command:
      ["pytest", "-q", "-rs", "-p", "no:cacheprovider", "-m", "deployed_service", "tests/deploy"]
    restart: "no"

  hardening:
    profiles: [smoke]
    image: ${TEST_IMAGE:-docintel-test}
    # Built by `smoke`; never pulled.
    pull_policy: never
    environment:
      SERVICE_URL: http://app:8000
      DOCKER_SOCKET: /var/run/docker.sock
    # The Engine's socket, for `docker inspect` and `docker exec` of the stack's containers (the
    # test image has no docker command). Read-only mount; the socket still accepts connections,
    # and the API it serves is the host's Docker, so this service is for a test run only. The
    # tests run as the image's user (10001) with the socket's group added: root (0) on Docker
    # Desktop, where the socket is root:root 0660; on a Linux host whose socket belongs to the
    # `docker` group, put that group's id here.
    group_add: ["0"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    command:
      [
        "pytest", "-q", "-rs", "-p", "no:cacheprovider", "-m", "deployed_service",
        "tests/deploy/test_hardening_smoke.py",
      ]
    restart: "no"

  hygiene:
    profiles: [smoke]
    image: ${APP_IMAGE:-docintel}
    network_mode: none
    restart: "no"
    # The pdf.js pin, read-only: the image's files are checked against the repository's lock.
    volumes:
      - ./deploy/pdfjs.lock:/run/pdfjs.lock:ro
    command:
      - sh
      - -c
      - |
        failed=0
        check() {
          if eval "$$2" > /dev/null 2>&1; then echo "ok    $$1"; else echo "FAIL  $$1"; failed=1; fi
        }
        check "runs as uid 10001" '[ "$$(id -u)" = 10001 ]'
        check "tini is PID 1" '[ "$$(cat /proc/1/comm)" = tini ]'
        check "pytest is not installed" '! python -c "import pytest"'
        check "pymupdf is not installed" '! python -c "import pymupdf"'
        check "no dev tools (ruff, mypy, pre-commit)" \
          '! python -c "import ruff" && ! python -c "import mypy" && ! python -c "import pre_commit"'
        check "no tests directory" '[ ! -e /app/tests ]'
        check "no sample PDFs" '[ ! -e /app/sample_pdfs ]'
        check "no .env files" '[ -z "$$(find /app -name ".env*")" ]'
        check "no uv or uvx" '! command -v uv && ! command -v uvx'
        check "Hugging Face offline" '[ "$$HF_HUB_OFFLINE" = 1 ] && [ "$$TRANSFORMERS_OFFLINE" = 1 ]'
        check "MALLOC_ARENA_MAX=2" '[ "$$MALLOC_ARENA_MAX" = 2 ]'
        check "service code is read-only" '! touch /app/app/main.py'
        check "models are read-only" '! touch /models/multilingual-e5-base/config.json'
        check "detector model: at INJECTION_MODEL_PATH with its NOTICE, read-only (or opted out)" \
          '[ -z "$$INJECTION_MODEL_PATH" ] || (
            [ -f "$$INJECTION_MODEL_PATH/model.safetensors" ] && [ -f "$$INJECTION_MODEL_PATH/LICENSE" ] &&
            grep -q "Built with Llama" "$$INJECTION_MODEL_PATH/NOTICE" && ! touch "$$INJECTION_MODEL_PATH/config.json" )'
        check "no Hugging Face token" '[ -z "$$HF_TOKEN" ] && [ ! -e /run/secrets/hf_token ] && [ ! -e /root/.cache/huggingface/token ]'
        check "scratch paths under /tmp" '[ "$$TMPDIR" = /tmp ] && [ "$$HF_HOME" = /tmp/huggingface ] && [ "$$TORCH_HOME" = /tmp/torch ]'
        check "pdf.js: at PDFJS_DIR, each file with its hash in deploy/pdfjs.lock, no other file" \
          '[ "$$PDFJS_DIR" = /app/vendor/pdfjs ] && [ "$$(ls -A /app/vendor/pdfjs | wc -l)" = 9 ] && (
            . /run/pdfjs.lock && cd /app/vendor/pdfjs && printf "%s  %s\n" \
              "$$PDFJS_LIB_SHA256" pdf.min.mjs \
              "$$PDFJS_WORKER_SHA256" pdf.worker.min.mjs \
              "$$PDFJS_JBIG2_FALLBACK_SHA256" jbig2_nowasm_fallback.js \
              "$$PDFJS_OPENJPEG_FALLBACK_SHA256" openjpeg_nowasm_fallback.js \
              "$$PDFJS_LICENSE_SHA256" LICENSE \
              "$$PDFJS_LICENSE_JBIG2_SHA256" LICENSE_JBIG2 \
              "$$PDFJS_LICENSE_OPENJPEG_SHA256" LICENSE_OPENJPEG \
              "$$PDFJS_LICENSE_PDFJS_JBIG2_SHA256" LICENSE_PDFJS_JBIG2 \
              "$$PDFJS_LICENSE_PDFJS_OPENJPEG_SHA256" LICENSE_PDFJS_OPENJPEG | sha256sum -c - )'
        check "pdf.js: owned by root, not writable by the service" \
          '[ -z "$$(find /app/vendor ! -user 0)" ] && ! touch /app/vendor/pdfjs/pdf.min.mjs && ! touch /app/vendor/pdfjs/new.mjs'
        check "no Playwright or browser" \
          '! python -c "import playwright" && [ ! -e /ms-playwright ] && [ -z "$$(find / -xdev \( -name chrome -o -name headless_shell -o -name "chromium*" \) -print -quit 2>/dev/null)" ]'
        check "torch matches TORCH_VARIANT (cpu: no CUDA, no nvidia-*/cuda-*/triton package; cuda: a CUDA build)"           'python -I -c "import importlib.metadata as m, os, sys, torch; v = os.environ[\"TORCH_VARIANT\"]; gpu = [d.metadata[\"Name\"] for d in m.distributions() if (d.metadata[\"Name\"] or \"\").lower().startswith((\"nvidia-\", \"cuda-\", \"triton\"))]; sys.exit(not ((v == \"cpu\" and not gpu and torch.version.cuda is None and not torch.cuda.is_available()) or (v == \"cuda\" and torch.version.cuda is not None)))"'
        check "the service imports" 'python -c "import app.main"'
        exit $$failed
