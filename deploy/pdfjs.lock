# pdf.js (npm package pdfjs-dist, Apache-2.0), the audit viewer's PDF renderer: the one pin read
# by the Dockerfile's `pdfjs` stage and scripts/fetch_pdfjs.py (both run that script), by the
# image hygiene check (docker-compose.smoke.yml) and by tests/viewer. One NAME=value per line,
# valid sh, no spaces or quotes.
#
# 6.4.299 (published 2026-10-03): the newest stable release at least two weeks old (2026-10-29),
# past CVE-2024-4367 (fixed in 4.2.67) and CVE-2026-16633 (5.6.83 up to 6.2.108, fixed there),
# the two script-execution advisories of the GitHub advisory database that cover 4.x and later.
# PDFJS_TARBALL_SHA256 is the sha256 of the npm tarball; the registry's sha512 "integrity" of
# the same file was checked against it when it was pinned.
#
# Kept from the tarball, each with its own sha256 below: the library and its worker
# (package/build/pdf.min.mjs, pdf.worker.min.mjs) and LICENSE; the JavaScript decoders pdf.js 6
# imports for CCITT/JBIG2 and JPEG 2000 images when WebAssembly is off (package/wasm/
# jbig2_nowasm_fallback.js, openjpeg_nowasm_fallback.js; no .wasm file is kept) and the four
# licences of those decoders (package/wasm/LICENSE_*), which the generated files do not carry.
#
# To bump: take "dist.tarball" of the new version from https://registry.npmjs.org/pdfjs-dist,
# download it, check its sha512 against "dist.integrity", put its sha256 here, then the sha256 of
# each kept file inside it. Check https://github.com/advisories?query=pdfjs-dist first, then
# rebuild and rerun the suites.
